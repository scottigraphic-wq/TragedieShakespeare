<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Le 11 tragedie di Shakespeare</title>
<style>
:root{--bg:#faf7f2;--fg:#2a2420;--mut:#6b6058;--card:#fff;--ac:#8b2c2c;--bd:#e4dcd0;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1c1917;--fg:#f1ebe3;--mut:#a89d92;--card:#262220;--ac:#e08a7a;--bd:#3a3430}}
:root[data-theme="dark"]{--bg:#1c1917;--fg:#f1ebe3;--mut:#a89d92;--card:#262220;--ac:#e08a7a;--bd:#3a3430}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font:17px/1.6 Georgia,"Times New Roman",serif}
main{max-width:640px;margin:0 auto;padding:24px 18px 48px}
h1{font-size:1.5rem;margin:0 0 4px}
.sub{color:var(--mut);font-size:.9rem;margin:0 0 20px}
ul{list-style:none;padding:0;margin:0}
li a{display:flex;justify-content:space-between;gap:12px;padding:12px 14px;margin-bottom:8px;background:var(--card);border:1px solid var(--bd);border-radius:10px;color:var(--fg);text-decoration:none}
li a span{color:var(--mut);font-size:.9rem;white-space:nowrap}
.back{display:inline-block;margin-bottom:16px;color:var(--ac);text-decoration:none;font-size:.95rem}
.date{color:var(--ac);font-weight:bold;margin:0 0 16px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:16px;margin-top:24px;text-align:center}
#qr{display:inline-block;background:#fff;padding:10px;border-radius:8px}
#qr img,#qr canvas{display:block}
.card p{font-size:.85rem;color:var(--mut);margin:10px 0 6px}
input{width:100%;box-sizing:border-box;font:13px monospace;padding:6px;border:1px solid var(--bd);border-radius:6px;background:var(--bg);color:var(--fg)}
.nav{display:flex;justify-content:space-between;margin-top:20px;font-size:.9rem}
.nav a{color:var(--ac);text-decoration:none}
.src{font-size:.8rem;color:var(--mut);margin-top:24px}
</style>
</head>
<body>
<main id="app"></main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
var T=[
["tito-andronico","Tito Andronico","Titus Andronicus","c. 1591-1592","Il generale romano Tito torna vittorioso dalla guerra contro i Goti e porta con sé prigioniera la regina Tamora. Sacrifica il figlio di lei, scatenando una spirale di vendetta. Tamora, divenuta imperatrice, fa violentare e mutilare Lavinia, figlia di Tito. Tito si vendica uccidendo i figli di Tamora e servendoglieli in un banchetto, e la tragedia si chiude con una strage generale."],
["romeo-e-giulietta","Romeo e Giulietta","Romeo and Juliet","c. 1595","A Verona, Romeo Montecchi e Giulietta Capuleti, figli di famiglie rivali, si innamorano e si sposano in segreto. Dopo l’uccisione di Tebaldo per mano di Romeo, lui viene esiliato. Un piano per ricongiungerli, basato su una finta morte di Giulietta, fallisce per un equivoco: Romeo si avvelena credendola morta, e lei si uccide a sua volta. La tragedia riconcilia le due famiglie."],
["giulio-cesare","Giulio Cesare","Julius Caesar","1599","Bruto, Cassio e altri congiurati uccidono Cesare per timore che diventi tiranno di Roma. Il discorso funebre di Marco Antonio volge il popolo contro i cospiratori. Ne seguono la guerra civile e la sconfitta di Bruto e Cassio a Filippi, che si tolgono la vita."],
["amleto","Amleto","Hamlet","c. 1600-1601","Il principe di Danimarca apprende dal fantasma del padre che questi è stato assassinato dallo zio Claudio, che ha preso il trono e sposato la regina Gertrude. Amleto finge la follia e indugia nella vendetta. Nel frattempo muoiono Polonio e Ofelia, e infine, in un duello truccato, Amleto, Claudio, Gertrude e Laerte."],
["troilo-e-cressida","Troilo e Cressida","Troilus and Cressida","c. 1602","Ambientata durante la guerra di Troia, narra l’amore tra il principe troiano Troilo e Cressida. Lei viene mandata al campo greco in uno scambio di prigionieri e lo tradisce. Sullo sfondo, i leader greci e troiani sono ritratti con toni cinici e disillusi, e Achille uccide Ettore in modo disonorevole. È considerata una tragedia dai toni di commedia amara."],
["otello","Otello","Othello","c. 1603-1604","Otello, generale moro al servizio di Venezia, sposa in segreto Desdemona. Iago, rancoroso per una promozione mancata, lo convince con intrighi e un fazzoletto che Desdemona lo tradisca con Cassio. Accecato dalla gelosia, Otello la strangola. Scoperta la verità, si uccide."],
["timone-d-atene","Timone d’Atene","Timon of Athens","c. 1605-1608","Il ricco ateniese Timone spende generosamente per gli amici. Quando cade in rovina, nessuno lo aiuta. Pieno di disprezzo per l’umanità, si ritira a vivere in una caverna, dove trova dell’oro ma lo usa solo per fomentare distruzione. Muore in solitudine."],
["re-lear","Re Lear","King Lear","c. 1606","Lear, re di Britannia, divide il regno tra le figlie Goneril e Regan, che lo adulano, e bandisce Cordelia, la sola sincera. Le due figlie lo umiliano e lo scacciano, e Lear impazzisce nella tempesta. Parallelamente, il conte di Gloucester è tradito dal figlio Edmund. Cordelia torna con un esercito ma muore, e Lear spira per il dolore."],
["macbeth","Macbeth","Macbeth","1606","Dopo la profezia delle tre streghe, Macbeth, generale scozzese, spinto dalla moglie uccide il re Duncan e prende la corona. Per conservarla commette altri omicidi, ma la colpa lo tormenta e Lady Macbeth impazzisce. Alla fine viene sconfitto e ucciso da Macduff."],
["antonio-e-cleopatra","Antonio e Cleopatra","Antony and Cleopatra","c. 1606-1607","Marco Antonio, uno dei triumviri di Roma, è diviso tra il dovere politico e la passione per Cleopatra, regina d’Egitto. Entra in guerra con Ottaviano e viene sconfitto ad Azio. Credendo falsamente morta Cleopatra, si uccide, e lei, per non essere umiliata da Ottaviano, si toglie la vita con un aspide."],
["coriolano","Coriolano","Coriolanus","c. 1608","Il valoroso generale romano Caio Marzio, detto Coriolano, è orgoglioso e sprezzante verso il popolo. Viene bandito da Roma e si allea con i nemici Volsci per marciare sulla città. La madre Volumnia lo convince a risparmiarla, ma questo gli costa la vita: i Volsci lo uccidono come traditore."]
];
var app=document.getElementById("app");
function base(){return location.href.split("#")[0]}
function home(){
  var h='<h1>Le tragedie di Shakespeare</h1><p class="sub">Sinossi, titolo e data di composizione (fonte: Wikipedia)</p><ul>';
  T.forEach(function(t){h+='<li><a href="#'+t[0]+'">'+t[1]+'<span>'+t[3]+'</span></a></li>'});
  app.innerHTML=h+'</ul>';
}
function show(i){
  var t=T[i],p=T[i-1],n=T[i+1];
  app.innerHTML='<a class="back" href="#">← Tutte le tragedie</a><h1>'+t[1]+'</h1><p class="sub">'+t[2]+'</p><p class="date">'+t[3]+'</p><p>'+t[4]+'</p>'
  +'<div class="nav"><span>'+(p?'<a href="#'+p[0]+'">← '+p[1]+'</a>':'')+'</span><span>'+(n?'<a href="#'+n[0]+'">'+n[1]+' →</a>':'')+'</span></div>'
  +'<div class="card"><div id="qr"></div><p>QR code di questa pagina</p><input id="u" aria-label="Indirizzo base della pagina"></div>'
  +'<p class="src">Fonte: Wikipedia.</p>';
  var u=document.getElementById("u"),box=document.getElementById("qr");
  u.value=base()+"#"+t[0];
  function draw(){box.innerHTML="";try{new QRCode(box,{text:u.value,width:200,height:200,correctLevel:QRCode.CorrectLevel.M})}catch(e){box.textContent="QR non disponibile"}}
  u.oninput=draw;draw();
}
function route(){
  var h=location.hash.slice(1),i=T.findIndex(function(t){return t[0]===h});
  window.scrollTo(0,0);
  if(i<0)home();else show(i);
}
window.addEventListener("hashchange",route);route();
</script>
</body>
</html>
